<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen mark</title>
  <desc id="desc">A solid black evergreen on a Robin Neon tile.</desc>

  <!-- Inverted from the previous version: the brand colour is now the ground and
       the mark is Robin Black. Robinhood's own lockup works this way — one solid
       shape, no gradients, no outline — and at #CCFF00 a black mark is the only
       pairing with enough contrast to survive at favicon size. -->
  <rect width="128" height="128" rx="30" fill="#ccff00"/>

  <!-- Same evergreen as before: two chevrons rising off a baseline. -->
  <g fill="#17160f">
    <path d="M64 20 90 56H73l0 0H38z"/>
    <path d="M64 44 102 90H26z"/>
    <rect x="57" y="88" width="14" height="16" rx="3"/>
    <rect x="26" y="106" width="76" height="4" rx="2"/>
  </g>
</svg>
